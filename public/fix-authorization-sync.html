<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权状态同步修复工具</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            text-align: center;
            color: #4facfe;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #4facfe;
        }
        .button {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }
        .button.danger {
            background: linear-gradient(45deg, #ff4757, #ff3838);
        }
        .button.success {
            background: linear-gradient(45deg, #2ed573, #1dd1a1);
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #a0a0a0;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }
        .result.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        .result.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        .result.loading {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
        }
        .result.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 3px solid #4facfe;
        }
        .status-good {
            border-left-color: #4caf50;
        }
        .status-bad {
            border-left-color: #f44336;
        }
        .status-warning {
            border-left-color: #ff9800;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            transition: width 0.3s ease;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .table th,
        .table td {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            text-align: left;
            font-size: 12px;
        }
        .table th {
            background: rgba(255, 255, 255, 0.1);
            color: #4facfe;
        }
        .status-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-icon.good {
            background: #4caf50;
        }
        .status-icon.bad {
            background: #f44336;
        }
        .status-icon.warning {
            background: #ff9800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 授权状态同步修复工具</h1>
        
        <div class="section">
            <h3>❓ 问题说明</h3>
            <p>此工具用于修复用户端已verify，但管理后台显示"未verify"的数据同步问题。</p>
            <ul>
                <li><strong>问题现象：</strong> 用户端成功verify，链上也显示成功，但管理后台显示未verify</li>
                <li><strong>解决方案：</strong> 检查链上真实状态，同步更新数据库 is_effective 字段</li>
                <li><strong>修复原理：</strong> 查询链上verify额度，如果 > 0 则设置数据库为已授权状态</li>
            </ul>
        </div>

        <div class="grid">
            <div class="section">
                <h3>🔧 单个用户修复</h3>
                <div class="input-group">
                    <label for="userAddress">用户钱包地址</label>
                    <input type="text" id="userAddress" value="0x8A5F7289AE958AB99Ca6a552Ac4164Ae8008247e" placeholder="输入用户钱包地址">
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="button" onclick="fixSingleUser(false)">🔄 智能修复</button>
                    <button class="button danger" onclick="fixSingleUser(true)">⚡ 强制同步</button>
                    <button class="button success" onclick="diagnoseSingleUser()">🔍 诊断状态</button>
                </div>
            </div>

            <div class="section">
                <h3>📊 批量检查与修复</h3>
                <div class="input-group">
                    <label for="checkLimit">检查用户数量</label>
                    <input type="number" id="checkLimit" value="10" min="1" max="100" placeholder="1-100">
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="button" onclick="batchCheck(false)">🔍 批量检查</button>
                    <button class="button danger" onclick="batchCheck(true)">🔍 检查全部</button>
                    <button class="button success" onclick="batchFix()">🔧 批量修复</button>
                </div>
            </div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        let batchCheckResults = [];

        async function fixSingleUser(forceSync = false) {
            const userAddress = document.getElementById('userAddress').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!userAddress) {
                resultDiv.innerHTML = '<div class="result error">请输入用户钱包地址</div>';
                return;
            }
            
            resultDiv.innerHTML = `<div class="result loading">🔧 ${forceSync ? '强制同步' : '智能修复'}授权状态中...</div>`;
            
            try {
                const response = await fetch('/api/admin/fix-authorization-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userAddress: userAddress,
                        forceSync: forceSync
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    let report = `✅ ${result.message}\n\n`;
                    
                    report += `👤 用户信息:\n`;
                    report += `   - 用户ID: ${data.userId}\n`;
                    report += `   - 地址: ${data.address}\n`;
                    report += `   - 是否更新: ${data.wasUpdated ? '是' : '否'}\n\n`;
                    
                    report += `🔗 链上状态:\n`;
                    report += `   - 授权状态: ${data.onChainStatus.authorized ? '✅ 已verify' : '❌ 未verify'}\n`;
                    report += `   - verify额度: ${data.onChainStatus.allowanceAmount} USDT\n\n`;
                    
                    report += `💾 数据库状态:\n`;
                    report += `   - 修复前: is_effective=${data.databaseStatus.before.is_effective}, approved=${data.databaseStatus.before.approved}\n`;
                    if (data.databaseStatus.after) {
                        report += `   - 修复后: is_effective=${data.databaseStatus.after.is_effective}, approved=${data.databaseStatus.after.approved}\n`;
                    }
                    report += `   - hash: ${data.databaseStatus.before.hash || '无'}\n\n`;
                    
                    if (data.fixApplied) {
                        report += `🔧 应用的修复:\n`;
                        report += `   - 更新字段: is_effective, approved, auth_address, update_time\n`;
                        report += `   - 新状态: ${data.fixApplied.is_effective === 1 ? '已verify' : '未verify'}\n\n`;
                    }
                    
                    report += `📋 后续建议:\n`;
                    report += `1. 刷新管理后台用户列表\n`;
                    report += `2. 验证授权状态显示正确\n`;
                    report += `3. 如有问题，检查前端显示逻辑\n`;
                    
                    resultDiv.innerHTML = `<div class="result success">${report}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ 修复失败\n\n错误信息: ${result.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ 修复过程中发生错误\n\n错误信息: ${error.message}</div>`;
            }
        }

        async function diagnoseSingleUser() {
            const userAddress = document.getElementById('userAddress').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!userAddress) {
                resultDiv.innerHTML = '<div class="result error">请输入用户钱包地址</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result loading">🔍 正在诊断用户授权状态...</div>';
            
            try {
                // 获取用户信息
                const userInfoResponse = await fetch(`/api/user/info?address=${encodeURIComponent(userAddress)}`);
                const userInfo = await userInfoResponse.json();
                
                if (!userInfo.success) {
                    resultDiv.innerHTML = `<div class="result error">❌ 获取用户信息失败: ${userInfo.error}</div>`;
                    return;
                }
                
                // 查询管理后台用户数据
                const adminResponse = await fetch(`/api/admin/users?search=${encodeURIComponent(userAddress)}&limit=1`);
                const adminData = await adminResponse.json();
                
                // 查询链上状态
                const balanceResponse = await fetch('/api/admin/query-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userInfo.data.id,
                        address: userAddress
                    })
                });
                const balanceData = await balanceResponse.json();
                
                let report = '🔍 用户授权状态诊断报告\n';
                report += '=' + '='.repeat(40) + '\n\n';
                
                // 用户基本信息
                report += '👤 用户基本信息:\n';
                report += `   - 用户ID: ${userInfo.data.id}\n`;
                report += `   - 钱包地址: ${userInfo.data.address}\n`;
                report += `   - 授权地址: ${userInfo.data.auth_address || '未设置'}\n\n`;
                
                // 用户端API状态
                report += '📱 用户端API状态:\n';
                report += `   - 授权状态: ${userInfo.data.isAuthorized ? '✅ 已授权' : '❌ 未授权'}\n`;
                report += `   - 余额信息: cash=${userInfo.data.cash}, usdt=${userInfo.data.usdt}, gj_cash=${userInfo.data.gj_cash}\n\n`;
                
                // 管理后台API状态
                if (adminData.success && adminData.data.users.length > 0) {
                    const adminUser = adminData.data.users[0];
                    report += '🖥️ 管理后台API状态:\n';
                    report += `   - is_effective: ${adminUser.is_effective} (${adminUser.is_effective === 1 ? '已授权' : '未授权'})\n`;
                    report += `   - approved: ${adminUser.approved || 0}\n`;
                    report += `   - hash: ${adminUser.hash || '无'}\n\n`;
                    
                    // 状态一致性检查
                    const userAuth = userInfo.data.isAuthorized;
                    const adminAuth = adminUser.is_effective === 1;
                    
                    report += '🔍 状态一致性检查:\n';
                    if (userAuth === adminAuth) {
                        report += `   ✅ 状态一致: 两个API都显示${userAuth ? '已授权' : '未授权'}\n`;
                    } else {
                        report += `   ❌ 状态不一致:\n`;
                        report += `      - 用户API: ${userAuth ? '已授权' : '未授权'}\n`;
                        report += `      - 管理API: ${adminAuth ? '已授权' : '未授权'}\n`;
                    }
                } else {
                    report += '🖥️ 管理后台API状态: ❌ 查询失败或用户不存在\n';
                }
                
                // 链上状态
                if (balanceData.success) {
                    const allowance = parseFloat(balanceData.data.allowance);
                    report += '\n🔗 链上状态:\n';
                    report += `   - USDT余额: ${balanceData.data.usdtBalance} USDT\n`;
                    report += `   - BNB余额: ${balanceData.data.bnbBalance} BNB\n`;
                    report += `   - verify额度: ${balanceData.data.allowance} USDT\n`;
                    report += `   - 授权状态: ${allowance > 0 ? '✅ 已verify' : '❌ 未verify'}\n`;
                } else {
                    report += '\n🔗 链上状态: ❌ 查询失败\n';
                }
                
                // 诊断结论
                report += '\n📋 诊断结论:\n';
                if (balanceData.success) {
                    const onChainAuth = parseFloat(balanceData.data.allowance) > 0;
                    const dbAuth = userInfo.data.isAuthorized;
                    
                    if (onChainAuth && dbAuth) {
                        report += '   ✅ 用户已正确verify，系统状态正常\n';
                    } else if (onChainAuth && !dbAuth) {
                        report += '   ⚠️ 链上已verify但数据库未同步，建议执行智能修复\n';
                    } else if (!onChainAuth && dbAuth) {
                        report += '   ⚠️ 数据库显示已verify但链上未verify，可能是verify已撤销\n';
                    } else {
                        report += '   ❌ 用户确实未verify\n';
                    }
                } else {
                    report += '   ⚠️ 无法确定链上状态，建议手动检查\n';
                }
                
                const statusClass = balanceData.success && parseFloat(balanceData.data.allowance) > 0 ? 'success' : 'info';
                resultDiv.innerHTML = `<div class="result ${statusClass}">${report}</div>`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ 诊断过程中发生错误\n\n错误信息: ${error.message}</div>`;
            }
        }

        async function batchCheck(checkAll = false) {
            const limit = checkAll ? null : parseInt(document.getElementById('checkLimit').value);
            const resultDiv = document.getElementById('result');
            
            if (!checkAll && (!limit || limit < 1 || limit > 100)) {
                resultDiv.innerHTML = '<div class="result error">请输入有效的检查数量 (1-100)</div>';
                return;
            }
            
            resultDiv.innerHTML = `<div class="result loading">🔍 开始批量检查${checkAll ? '所有' : limit}个用户的授权状态...</div>`;
            
            try {
                const url = `/api/admin/fix-authorization-sync?checkAll=${checkAll}${!checkAll ? `&limit=${limit}` : ''}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    batchCheckResults = result.data.users;
                    const data = result.data;
                    
                    let report = `🔍 批量检查完成\n`;
                    report += '=' + '='.repeat(30) + '\n\n';
                    report += `📊 检查统计:\n`;
                    report += `   - 总检查数: ${data.totalChecked}\n`;
                    report += `   - 状态不一致: ${data.inconsistentCount}\n`;
                    report += `   - 一致率: ${((data.totalChecked - data.inconsistentCount) / data.totalChecked * 100).toFixed(1)}%\n\n`;
                    
                    if (data.inconsistentCount > 0) {
                        report += `⚠️ 发现 ${data.inconsistentCount} 个用户状态不一致:\n\n`;
                        
                        // 创建表格
                        report += `<table class="table">
                            <thead>
                                <tr>
                                    <th>用户ID</th>
                                    <th>地址</th>
                                    <th>数据库</th>
                                    <th>链上</th>
                                    <th>verify额度</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody>`;
                        
                        data.users.forEach(user => {
                            if (user.isInconsistent) {
                                const statusIcon = user.onChainStatus ? 'good' : 'bad';
                                const statusText = user.onChainStatus ? '需要同步到已verify' : '需要同步到未verify';
                                report += `
                                    <tr>
                                        <td>${user.userId}</td>
                                        <td>${user.address.substring(0, 10)}...</td>
                                        <td>${user.databaseStatus ? '已verify' : '未verify'}</td>
                                        <td>${user.onChainStatus ? '已verify' : '未verify'}</td>
                                        <td>${user.allowanceAmount}</td>
                                        <td><span class="status-icon ${statusIcon}"></span>${statusText}</td>
                                    </tr>`;
                            }
                        });
                        
                        report += `</tbody></table>`;
                        
                        report += `\n📋 建议操作:\n`;
                        report += `1. 点击"批量修复"按钮修复所有不一致的用户\n`;
                        report += `2. 或手动逐个修复有问题的用户\n`;
                    } else {
                        report += `✅ 所有用户的授权状态都是一致的，无需修复\n`;
                    }
                    
                    const statusClass = data.inconsistentCount > 0 ? 'info' : 'success';
                    resultDiv.innerHTML = `<div class="result ${statusClass}">${report}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ 批量检查失败\n\n错误信息: ${result.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ 批量检查过程中发生错误\n\n错误信息: ${error.message}</div>`;
            }
        }

        async function batchFix() {
            if (!batchCheckResults || batchCheckResults.length === 0) {
                document.getElementById('result').innerHTML = '<div class="result error">请先执行批量检查</div>';
                return;
            }
            
            const inconsistentUsers = batchCheckResults.filter(user => user.isInconsistent);
            
            if (inconsistentUsers.length === 0) {
                document.getElementById('result').innerHTML = '<div class="result success">没有需要修复的用户</div>';
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result loading">🔧 开始批量修复 ${inconsistentUsers.length} 个用户...</div>`;
            
            let successCount = 0;
            let failCount = 0;
            let report = '🔧 批量修复进度:\n\n';
            
            for (let i = 0; i < inconsistentUsers.length; i++) {
                const user = inconsistentUsers[i];
                
                try {
                    const response = await fetch('/api/admin/fix-authorization-sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userAddress: user.address,
                            forceSync: false
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        successCount++;
                        report += `✅ 用户 ${user.userId} (${user.address.substring(0, 10)}...) - 修复成功\n`;
                    } else {
                        failCount++;
                        report += `❌ 用户 ${user.userId} (${user.address.substring(0, 10)}...) - 修复失败: ${result.error}\n`;
                    }
                } catch (error) {
                    failCount++;
                    report += `❌ 用户 ${user.userId} (${user.address.substring(0, 10)}...) - 网络错误: ${error.message}\n`;
                }
                
                // 更新进度
                const progress = ((i + 1) / inconsistentUsers.length * 100).toFixed(1);
                const progressHtml = `
                    <div class="result loading">
                        🔧 批量修复进行中 (${i + 1}/${inconsistentUsers.length})
                        <div class="progress">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        ${report}
                    </div>
                `;
                resultDiv.innerHTML = progressHtml;
                
                // 避免请求过快
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            report += `\n📊 批量修复完成:\n`;
            report += `   - 成功: ${successCount} 个\n`;
            report += `   - 失败: ${failCount} 个\n`;
            report += `   - 成功率: ${(successCount / inconsistentUsers.length * 100).toFixed(1)}%\n\n`;
            report += `📋 建议操作:\n`;
            report += `1. 刷新管理后台用户列表验证修复效果\n`;
            report += `2. 对于修复失败的用户，可尝试手动修复\n`;
            
            const statusClass = failCount === 0 ? 'success' : 'info';
            resultDiv.innerHTML = `<div class="result ${statusClass}">${report}</div>`;
        }
    </script>
</body>
</html>
