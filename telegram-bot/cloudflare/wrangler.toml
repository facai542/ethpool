name = "telegram-bot-webhook"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 环境变量（在 Cloudflare Dashboard 中设置，不要在这里写敏感信息）
[vars]
MAIN_DOMAIN = "your-domain.com"

# 生产环境
[env.production]
route = { pattern = "bot.yourdomain.com/*", zone_name = "yourdomain.com" }

# KV 命名空间（用于存储群组状态等）
# [[kv_namespaces]]
# binding = "BOT_STATE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# Durable Objects（可选，用于存储状态）
# [[durable_objects.bindings]]
# name = "BOT_STATE"
# class_name = "BotState"
# script_name = "telegram-bot-webhook"

# Cron Triggers（用于定时任务，如区块扫描）
# [[triggers.crons]]
# cron = "*/30 * * * * *"  # 每30秒执行一次
# 
# [[triggers.crons]]
# cron = "0 */5 * * * *"   # 每5分钟执行一次（余额更新）



