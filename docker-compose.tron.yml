version: '3.8'

services:
  tron-node:
    image: tronprotocol/tron-quickstart:latest
    container_name: tron-testnet-node
    ports:
      - "8090:8090"  # FullNode HTTP API
      - "8091:8091"  # FullNode gRPC API
      - "18888:18888"  # P2P 端口
    environment:
      - NETWORK=shasta
    volumes:
      - ./tron-data:/tron/data
    restart: unless-stopped
    networks:
      - tron-network

networks:
  tron-network:
    driver: bridge

